<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>地理 合格ライン問題集</title>
<style>
:root{
  --bg:#f3f6f7; --card:#fff; --ink:#1d2b30; --sub:#5d6f75; --line:#dbe3e6;
  --main:#0f5f6e; --main2:#e3f0f2; --pick:#1f6fb5; --pickbg:#e6f0fa;
  --ok:#2e9e4f; --ng:#d23c3c; --okbg:#e7f6ec; --ngbg:#fde9e9; --hdr:#0f5f6e;
  --l6:#1f6fb5; --l7:#2e9e4f; --l8:#7b4fb5; --l9:#c8302f;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#0f1719; --card:#182326; --ink:#e4ecee; --sub:#9db0b5; --line:#2a3a3e;
    --main:#4fb3c4; --main2:#1c3236; --pickbg:#16283a; --okbg:#173023; --ngbg:#3a1c1c; --hdr:#123d45; }
}
:root[data-theme="dark"]{ --bg:#0f1719; --card:#182326; --ink:#e4ecee; --sub:#9db0b5; --line:#2a3a3e;
  --main:#4fb3c4; --main2:#1c3236; --pickbg:#16283a; --okbg:#173023; --ngbg:#3a1c1c; --hdr:#123d45; }
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic",system-ui,sans-serif;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{opacity:.4;cursor:default}
a{color:inherit}
header{position:sticky;top:0;z-index:30;background:var(--hdr);color:#fff;display:flex;align-items:center;gap:8px;padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top))}
header .t{font-weight:800;font-size:17px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header button{background:rgba(255,255,255,.16);border:0;border-radius:8px;padding:6px 11px;color:#fff;font-size:14px;white-space:nowrap}
header #send{background:#f0a531;color:#1d2b30;font-weight:800}
main{max-width:1180px;margin:0 auto;padding:16px}
.muted{color:var(--sub)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
h3.sec{margin:18px 0 8px;font-size:15px;color:var(--sub)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:2px solid var(--line);background:var(--card);border-radius:12px;padding:8px 14px;font-weight:700;font-size:15px;display:flex;flex-direction:column;align-items:center;min-width:76px}
.seg button small{font-weight:500;font-size:11.5px;color:var(--sub)}
.seg button.on{border-color:var(--main);background:var(--main2)}
.seg button.on.T6{border-color:var(--l6)}.seg button.on.T7{border-color:var(--l7)}.seg button.on.T8{border-color:var(--l8)}.seg button.on.T9{border-color:var(--l9)}
.chgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.ch{display:block;text-decoration:none}
.ch h3{margin:2px 0 6px;font-size:18px}
.ch .no{color:var(--main);font-weight:800;font-size:13px}
.bar{height:8px;border-radius:5px;background:var(--main2);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.stats{display:flex;gap:14px;font-size:13px;margin-top:8px;flex-wrap:wrap}
.tabs{display:flex;gap:6px;margin:4px 0 14px;flex-wrap:wrap}
.pill{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 14px;font-size:14px;text-decoration:none;display:inline-block}
.pill.on{background:var(--main);border-color:var(--main);color:#fff}
.qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:8px}
.q{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--l6);border-radius:9px;padding:8px 10px;text-decoration:none;min-height:46px}
.q b{font-size:14px;white-space:nowrap}
.q span{font-size:12.5px;color:var(--sub);flex:1;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.q em{font-style:normal;font-weight:800;min-width:22px;text-align:center}
.L6{border-left-color:var(--l6)}.L7{border-left-color:var(--l7)}.L8{border-left-color:var(--l8)}.L9{border-left-color:var(--l9)}
.ok{color:var(--ok)}.ng{color:var(--ng)}.pk{color:var(--pick)}
.lbadge{display:inline-block;color:#fff;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700;white-space:nowrap}
.B6{background:var(--l6)}.B7{background:var(--l7)}.B8{background:var(--l8)}.B9{background:var(--l9)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:0;border-radius:10px;padding:10px 16px;background:var(--main);color:#fff;font-weight:700;font-size:15px;text-decoration:none;display:inline-block}
:root[data-theme="dark"] .btn{color:#0f1719}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn{color:#0f1719}}
.btn.sec{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.send{background:#f0a531;color:#1d2b30}
.page{position:relative;background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.12);line-height:0}
.page img{width:100%;height:auto;display:block}
.spot{position:absolute;border-radius:8px;border:2px solid transparent;background:transparent;padding:0;transition:background .15s}
@media (hover:hover){.spot:hover{background:rgba(15,95,110,.10);border-color:rgba(15,95,110,.4)}}
.spot.sel{background:rgba(31,111,181,.16);border-color:var(--pick)}
.spot.pick{background:rgba(210,60,60,.15);border-color:var(--ng)}
.spot.right{background:rgba(46,158,79,.18);border-color:var(--ok)}
.port{max-width:820px;margin:0 auto}
.ansbar{position:sticky;bottom:0;z-index:15;margin:10px -16px 0;padding:8px 12px calc(8px + env(safe-area-inset-bottom));background:var(--card);border-top:1px solid var(--line);box-shadow:0 -4px 16px rgba(0,0,0,.06)}
.abar{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:8px;max-width:1180px;margin:0 auto}
.abar .mid{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}
.abar .nb{width:46px;height:46px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:24px;line-height:1;padding:0}
.abar .aux{display:flex;align-items:center;gap:6px}
.abar .cnt{font-size:12px;color:var(--sub);white-space:nowrap}
.pill.sm{padding:5px 10px;font-size:12px}
:root{--fitH:calc(100dvh - 150px - env(safe-area-inset-bottom))}
@supports not (height:100dvh){:root{--fitH:calc(100vh - 150px)}}
.page.fit{width:min(100%,calc(var(--fitH) * var(--ar)));aspect-ratio:var(--ar);margin:0 auto}
.page.fit>img{position:absolute;max-width:none}
.page.wide>img{position:absolute;max-width:none}
.choices{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.choices button{min-width:50px;height:46px;border-radius:12px;border:2px solid var(--line);background:var(--card);font-size:22px;font-weight:700}
.choices button.sel{border-color:var(--pick);background:var(--pickbg);color:var(--pick)}
.choices button.right{border-color:var(--ok);background:var(--okbg);color:var(--ok)}
.choices button.pick{border-color:var(--ng);background:var(--ngbg);color:var(--ng)}
.verdict{display:flex;align-items:center;gap:12px;border-radius:12px;padding:12px 16px;margin:12px 0;font-weight:800;font-size:20px;flex-wrap:wrap}
.verdict.ok{background:var(--okbg)}.verdict.ng{background:var(--ngbg)}.verdict.nt{background:var(--main2)}
.verdict small{font-weight:500;font-size:14px;color:var(--ink)}
.nav{display:flex;gap:8px;justify-content:space-between;align-items:center;margin-top:8px}
.nav .mid{flex:1;display:flex;justify-content:center;gap:8px;flex-wrap:wrap;text-align:center;font-size:13px}
.qhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.qhead h2{margin:0;font-size:22px}
.sum .page{margin-bottom:14px}
#result{scroll-margin-top:64px}
.empty{padding:30px;text-align:center}
.res{display:grid;gap:8px}
.res details{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--l6);border-radius:10px}
.res summary{display:flex;align-items:center;gap:10px;padding:10px 12px;cursor:pointer;list-style:none;flex-wrap:wrap}
.res summary::-webkit-details-marker{display:none}
.res summary .mk{font-size:22px;font-weight:900;width:26px;text-align:center}
.res summary .tt{flex:1;min-width:150px;font-size:13.5px}
.res summary .aa{font-size:13.5px;white-space:nowrap}
.res details[open] summary{border-bottom:1px solid var(--line)}
.res details .page{margin:10px;border-radius:8px}
.score{font-size:44px;font-weight:900;line-height:1}
dialog{border:0;border-radius:16px;padding:0;max-width:520px;width:calc(100% - 32px);background:var(--card);color:var(--ink);box-shadow:0 10px 40px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(0,0,0,.4)}
.dlg{padding:18px}
.dlg h2{margin:0 0 12px;font-size:19px}
.opt{display:flex;gap:10px;align-items:flex-start;border:2px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;cursor:pointer}
.opt.on{border-color:var(--main);background:var(--main2)}
.opt b{display:block}
.opt span{font-size:13px;color:var(--sub)}
.fld{display:block;margin-bottom:10px}
.fld span{display:block;font-size:13px;color:var(--sub);margin-bottom:4px}
.fld input{width:100%;font:inherit;font-size:16px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.msg{font-size:13px;margin:6px 0;min-height:1em}
.sync{font-size:12px;color:var(--sub)}
.port{max-width:820px;margin:0 auto}
/* 書き込み */
.ink{position:absolute;inset:0;width:100%;height:100%;z-index:5;pointer-events:none}
body.inking .ink{pointer-events:auto;touch-action:none;cursor:crosshair}
body.inking .spot{pointer-events:none}
.inkbar{position:fixed;right:12px;top:50%;transform:translateY(-50%);z-index:25;display:flex;flex-direction:column;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px;box-shadow:0 4px 18px rgba(0,0,0,.18)}
.inkbar button{width:42px;height:42px;border-radius:10px;border:2px solid transparent;background:transparent;font-size:19px;display:flex;align-items:center;justify-content:center;padding:0}
.inkbar button.on{border-color:var(--main);background:var(--main2)}
.inkbar .dot{width:20px;height:20px;border-radius:50%;display:block}
.inkbar hr{border:0;border-top:1px solid var(--line);margin:2px 0;width:100%}
.inkbar .tools{display:none;flex-direction:column;gap:6px}
body.inking .inkbar .tools{display:flex}
.inkbar small{font-size:9px;line-height:1;text-align:center;color:var(--sub)}
/* ===== モーション ===== */
:root{--ease:cubic-bezier(.2,.8,.2,1);--spring:cubic-bezier(.34,1.56,.64,1)}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes inR{from{opacity:0;transform:translateX(36px)}to{opacity:1;transform:none}}
@keyframes inL{from{opacity:0;transform:translateX(-36px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.14)}100%{transform:scale(1)}}
@keyframes popIn{0%{opacity:0;transform:scale(.6)}100%{opacity:1;transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(31,111,181,.45)}100%{box-shadow:0 0 0 12px rgba(31,111,181,0)}}
@keyframes ringOk{0%{box-shadow:0 0 0 0 rgba(46,158,79,.55)}100%{box-shadow:0 0 0 16px rgba(46,158,79,0)}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes bump{0%{transform:scale(1)}35%{transform:scale(1.18)}100%{transform:scale(1)}}
@keyframes spark{0%{opacity:1;transform:translate(0,0) scale(1)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.3)}}
@keyframes dlgIn{from{opacity:0;transform:translateY(16px) scale(.96)}to{opacity:1;transform:none}}
@keyframes bdIn{from{opacity:0}to{opacity:1}}
@keyframes reveal{from{opacity:0;transform:translateY(-8px);clip-path:inset(0 0 100% 0)}to{opacity:1;transform:none;clip-path:inset(0 0 0 0)}}
#app.enter>*{animation:fadeUp .38s var(--ease) backwards}
#app.enter-next>*{animation:inR .34s var(--ease) backwards}
#app.enter-prev>*{animation:inL .34s var(--ease) backwards}
#app.enter>*:nth-child(2),#app.enter-next>*:nth-child(2),#app.enter-prev>*:nth-child(2){animation-delay:.05s}
#app.enter>*:nth-child(3),#app.enter-next>*:nth-child(3),#app.enter-prev>*:nth-child(3){animation-delay:.1s}
#app .ansbar{animation:none!important}
.stg>*{animation:fadeUp .4s var(--ease) backwards;animation-delay:var(--d,0s)}
.bar i{transform-origin:left;animation:grow .8s var(--ease) backwards .15s}
.card,.q,.ch{transition:transform .2s var(--ease),box-shadow .2s var(--ease),border-color .2s}
@media (hover:hover){.ch:hover,.q:hover{transform:translateY(-3px);box-shadow:0 8px 22px rgba(15,40,50,.12)}}
.btn,.pill,.seg button,.choices button,header button,.inkbar button{transition:transform .15s var(--ease),background .2s,border-color .2s,color .2s,box-shadow .2s}
.btn:active,.pill:active,.seg button:active,.choices button:active,header button:active,.inkbar button:active{transform:scale(.94)}
.seg button.on{animation:pop .3s var(--spring)}
.choices button.sel{animation:pop .32s var(--spring),ring .6s ease-out}
.spot.sel{animation:ring .6s ease-out}
.choices button.right{animation:pop .4s var(--spring),ringOk .8s ease-out}
.choices button.pick{animation:shake .45s ease}
.verdict{animation:popIn .38s var(--spring) both;position:relative;overflow:visible}
.verdict.ng{animation:popIn .3s var(--ease) both,shake .45s ease .25s}
.verdict .mkk{display:inline-block;animation:pop .5s var(--spring) .15s}
.spark{position:absolute;left:34px;top:50%;width:8px;height:8px;border-radius:50%;pointer-events:none;animation:spark .7s var(--ease) forwards}
#result .page{animation:reveal .5s var(--ease) both .12s}
.page img{opacity:0;transition:opacity .35s ease}
.page img.ld{opacity:1}
header #send.bump{animation:bump .35s var(--spring)}
header #send{animation:popIn .3s var(--spring)}
dialog[open]{animation:dlgIn .28s var(--ease)}
dialog[open]::backdrop{animation:bdIn .25s ease}
.inkbar{transition:opacity .25s,transform .25s var(--ease)}
.inkbar .tools{animation:fadeUp .25s var(--ease)}
.res details .page{animation:reveal .4s var(--ease) both}
.score{display:inline-block;animation:popIn .5s var(--spring) both .1s}
.spot{transition:background .2s,border-color .2s}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}.page img{opacity:1}}
@media (max-width:600px){.inkbar{top:auto;bottom:calc(200px + env(safe-area-inset-bottom));transform:none;right:6px}.inkbar button{width:38px;height:38px}}
/* 印刷 */
.pp{background:#fff;margin:0 auto 14px;box-shadow:0 1px 4px rgba(0,0,0,.15);line-height:0}
.pp img{width:100%;display:block}
.pp.P{max-width:700px}.pp.L{max-width:1000px}
@page{size:A4 portrait;margin:0}
@page land{size:A4 landscape;margin:0}
@media print{
  header,.noprint,.inkbar,.ansbar{display:none!important}
  html,body{background:#fff!important}
  main{max-width:none;padding:0;margin:0}
  .pp{box-shadow:none;margin:0;max-width:none;break-after:page;page-break-after:always}
  .pp.P{width:210mm;height:297mm}.pp.P img{width:210mm;height:297mm;object-fit:contain}
  .pp.L{page:land;width:297mm;height:210mm}.pp.L img{width:297mm;height:210mm;object-fit:contain}
}
@media (max-width:600px){ header #acct{max-width:92px;overflow:hidden;text-overflow:ellipsis} header #gear{font-size:0;padding:6px 9px} header #gear::before{content:'⚙';font-size:15px}
 main{padding:12px} .ansbar{margin:12px -12px 0} .qhead h2{font-size:19px} .choices button{min-width:44px;height:46px;font-size:20px} header .t{font-size:15px} .seg button{min-width:0;flex:1;padding:8px 6px} }
</style>
</head>
<body>
<header>
  <button id="back" style="display:none">‹ 戻る</button>
  <div class="t" id="title">地理 合格ライン問題集</div>
  <button id="send" style="display:none">解答を送信</button>
  <button id="acct" title="アカウント">👤 ログイン</button>
  <button id="gear" title="設定">⚙ 設定</button>
</header>
<main id="app"></main>

<dialog id="dlg"><div class="dlg">
  <h2>設定</h2>
  <h3 class="sec" style="margin-top:0">採点のしかた</h3>
  <label class="opt" data-grade="batch"><input type="radio" name="g"><div><b>まとめて採点（送信ボタン）</b><span>選択肢を選んでおき、「解答を送信」を押すと、解いた問題の正解・解説がまとめて出ます。選び直しもOK。</span></div></label>
  <label class="opt" data-grade="instant"><input type="radio" name="g"><div><b>その場で採点</b><span>選択肢を押した瞬間に正解・解説が出ます。</span></div></label>
  <h3 class="sec">何割目標</h3>
  <div class="seg" id="dlgTarget"></div>
  <p class="muted" style="font-size:12.5px;margin:8px 0 0">目標の割合に必要な問題だけを出題します（例：7割目標＝6割ライン＋7割ラインの問題）。</p>
  <h3 class="sec">ページの向き</h3>
  <div class="row"><button class="pill" data-view="">自動（画面の向き）</button><button class="pill" data-view="land">横（iPad版）</button><button class="pill" data-view="port">縦（印刷用A4版）</button></div>
  <p class="muted" style="font-size:12.5px;margin:8px 0 0">自動にすると、iPadやスマホを縦にしたときは縦長のページ、横にしたときは横長のページを表示します。</p>
  <h3 class="sec">表示</h3>
  <div class="row"><button class="pill" data-th="">自動</button><button class="pill" data-th="light">ライト</button><button class="pill" data-th="dark">ダーク</button></div>
  <div class="row" style="justify-content:flex-end;margin-top:16px"><button class="btn" id="dlgClose">閉じる</button></div>
</div></dialog>

<dialog id="adlg"><div class="dlg" id="adlgBody"></div></dialog>

<script src="data.js"></script>
<script>
const CIRC="①②③④⑤⑥⑦⑧⑨";
const BOOK=window.BOOK||[];
const ALLQ=BOOK.flatMap(c=>c.questions.map(q=>(q.ch=c.ch,q)));
const QMAP=Object.fromEntries(ALLQ.map(q=>[q.id,q]));
const $app=document.getElementById('app');
const KEY='geo-gokaku-v1';
const load=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}};
const store=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
let S=load(KEY,{});            // 解答記録 {id:{r:bool,k:選んだ番号,n:回数,at}}
let P=load(KEY+'-pending',{});  // 送信前の選択 {id:k}
let ui=Object.assign({target:0,grade:'batch',mode:'all',theme:'',view:''},load(KEY+'-ui',{}));
let LAST=load(KEY+'-last',[]);  // 直近の送信結果
const save=()=>{store(KEY,S);store(KEY+'-pending',P);store(KEY+'-ui',ui);store(KEY+'-last',LAST);cloudSchedule();};
let queue=null;
const TG=[[6,'6割'],[7,'7割'],[8,'8割'],[9,'9割'],[0,'全問']];
const inTarget=q=>!ui.target||(q.line||9)<=ui.target;
const res=id=>S[id];
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num=q=>q.id.split('-')[1];
const qurl=q=>`#/ch/${q.ch}/q/${num(q)}`;

// ---- テーマ
function applyTheme(){const r=document.documentElement;if(ui.theme)r.dataset.theme=ui.theme;else delete r.dataset.theme;}
applyTheme();

// ---- ヘッダー
document.getElementById('back').onclick=()=>{const h=location.hash.split('/');if(h[1]==='ch'&&h.length>3)location.hash=h.slice(0,3).join('/');else location.hash='#/';};
document.getElementById('send').onclick=()=>submitAll();
function setHead(t,back){
  document.getElementById('title').textContent=t;
  document.getElementById('back').style.display=back?'':'none';
  document.title=back?t+' | 地理 合格ライン':'地理 合格ライン問題集';
  refreshSend();
}
let lastSendN=0;
function refreshSend(){
  const n=Object.keys(P).length,b=document.getElementById('send');
  if(n>lastSendN&&lastSendN>0){b.classList.remove('bump');void b.offsetWidth;b.classList.add('bump');}lastSendN=n;

}

function bindTarget(el,after){el.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{ui.target=+b.dataset.t;save();after();});}

function stats(list){let ok=0,ng=0;list.forEach(q=>{const r=res(q.id);if(r)r.r?ok++:ng++;});return{ok,ng,total:list.length};}
function bar(s,h){const t=s.total||1;return `<div class="bar" style="${h?'height:'+h+'px':''}"><i style="width:${s.ok/t*100}%;background:var(--ok)"></i><i style="width:${s.ng/t*100}%;background:var(--ng)"></i></div>`;}
function startQueue(list){if(!list.length)return;queue=list.map(q=>q.id);location.hash=qurl(list[0]);}

// ---- 章
function chapter(c,tab){

  const tl=c.questions.filter(inTarget);
  const filt=tl.filter(q=>ui.mode==='all'||(ui.mode==='todo'&&!res(q.id))||(ui.mode==='wrong'&&res(q.id)&&!res(q.id).r));

  let body='';
  if(tab==='sum'){
    const sm=sumPages(c);
    body=sm.list.length?`<div class="sum ${sm.port?'port':''}">${sm.list.map(p=>`<div class="page"><img loading="lazy" src="${p}.webp" alt="まとめページ"></div>`).join('')}</div>`:'<div class="card empty">まとめページはありません</div>';
  }else{
    body=`<div class="card" style="margin-bottom:12px;padding:12px">
      <div class="seg" id="tg">${TG.map(([t,l])=>`<button class="T${t} ${ui.target==t?'on':''}" data-t="${t}">${l}${t?'目標':''}<small>${c.questions.filter(q=>!t||(q.line||9)<=t).length}問</small></button>`).join('')}</div>
      <div class="row" style="margin-top:10px">${[['all','すべて'],['todo','未回答'],['wrong','間違い']].map(([m,t])=>`<button class="pill ${ui.mode==m?'on':''}" data-mode="${m}">${t}</button>`).join('')}
      <span class="muted" style="font-size:13px;margin-left:6px">○ ${s.ok}／× ${s.ng}／${s.total}問</span></div>
      <div class="row" style="margin-top:10px"><button class="btn" id="start" ${filt.length?'':'disabled'}>この${filt.length}問を順に解く</button><button class="btn sec" id="shuf" ${filt.length?'':'disabled'}>シャッフル</button>
      <button class="pill" id="reset" style="margin-left:auto;font-size:12px">この章の記録を消す</button></div></div>
    <div class="qgrid">${filt.map(q=>{const r=res(q.id),p=P[q.id];return `<a class="q L${q.line}" href="${qurl(q)}"><b>${q.id}</b><span>${esc(q.title||'')}</span><em class="${p?'pk':r?(r.r?'ok':'ng'):''}">${p?CIRC[p-1]:r?(r.r?'○':'×'):''}</em></a>`}).join('')||'<div class="card empty">該当する問題はありません</div>'}</div>`;
  }
  $app.innerHTML=`<div class="tabs"><a class="pill ${tab!=='sum'?'on':''}" href="#/ch/${c.ch}">演習</a><a class="pill ${tab==='sum'?'on':''}" href="#/ch/${c.ch}/sum">まとめ（${c.summary.length}p）</a>${c.ansTable?`<a class="pill" href="${c.ansTable}.webp" target="_blank">正解一覧</a>`:''}<button class="pill" id="prt">🖨 印刷</button></div>${body}`;
  const tg=document.getElementById('tg');if(tg)bindTarget(tg,()=>chapter(c,tab));
  document.getElementById('prt').onclick=()=>openPrint(c);

// ---- 問題
function question(c,n){
  const q=c.questions.find(x=>num(x)===n);
  if(!q){location.hash=`#/ch/${c.ch}`;return;}
  setHead(`${q.id} ${q.title||''}`,true);
  const list=queue&&queue.includes(q.id)?queue:c.questions.filter(inTarget).map(x=>x.id).concat(inTarget(q)?[]:[q.id]);
  const pos=list.indexOf(q.id),prev=QMAP[list[pos-1]],next=QMAP[list[pos+1]];
  const N=q.n||4, batch=ui.grade==='batch', r=res(q.id);
  $app.innerHTML=`<div id="qwrap">${qPageHtml(q)}</div>
    <div id="result"></div>
    <div class="ansbar"><div class="abar">
      <button class="nb" id="prev" ${prev?'':'disabled'} aria-label="前の問題">‹</button>
      <div class="mid"><div class="choices">${Array.from({length:N},(_,i)=>`<button data-k="${i+1}">${CIRC[i]}</button>`).join('')}</div>
        <span id="mid" style="display:contents"></span>
        <span class="aux"><span class="cnt">${pos+1}/${list.length}${r?` <b class="${r.r?'ok':'ng'}">${r.r?'○':'×'}</b>`:''}</span><button class="pill sm" id="skip">解説</button><button class="pill sm" id="fitBtn" title="ページの大きさ">${ui.wide?'全体':'拡大'}</button></span></div>
      <button class="nb" id="next" ${next?'':'disabled'} aria-label="次の問題">›</button></div></div>`;
  const go=x=>{if(x){NAVDIR=x===next?'next':x===prev?'prev':'';location.hash=qurl(x);}};
  document.getElementById('prev').onclick=()=>go(prev);
  document.getElementById('next').onclick=()=>go(next);
  const mid=document.getElementById('mid');
  const btns=()=>$app.querySelectorAll('[data-k]');
  let done=false;
  const paintSel=k=>btns().forEach(b=>b.classList.toggle('sel',+b.dataset.k===k));
  const midBatch=()=>{
    mid.innerHTML=`<button class="btn send" id="send2"></button>`;
    document.getElementById('send2').onclick=()=>submitAll();
    refreshSend();};
  const reveal=(k)=>{ // k=選んだ番号 / null=解説だけ
    done=true;const skb=document.getElementById('skip');if(skb)skb.style.display='none';
    btns().forEach(b=>{b.classList.remove('sel');const bk=+b.dataset.k;if(bk==q.ans)b.classList.add('right');else if(bk==k)b.classList.add('pick');});
    const ok=k==q.ans;
    const v=k==null?`<div class="verdict nt">正解は ${CIRC[q.ans-1]}</div>`:ok?`<div class="verdict ok"><span class="ok"><span class="mkk">○</span> 正解！</span><small>${CIRC[q.ans-1]}</small></div>`:`<div class="verdict ng"><span class="ng"><span class="mkk">×</span> 不正解</span><small>あなたの解答 ${CIRC[k-1]} ／ 正解は <b>${CIRC[q.ans-1]}</b></small></div>`;
    document.getElementById('result').innerHTML=v+`<div class="page" id="apage"><img src="${q.a}.webp" alt="解説 ${q.id}"></div>`;
    attachInk(document.getElementById('apage'),q.a);
    if(k!=null&&ok)sparks(document.querySelector('#result .verdict'));
    mid.innerHTML=next?'<button class="btn" id="next2">次へ ›</button>':`<a class="btn" href="#/ch/${c.ch}">一覧へ</a>`;
    const n2=document.getElementById('next2');if(n2)n2.onclick=()=>go(next);
    setTimeout(()=>document.getElementById('result').scrollIntoView({behavior:'smooth',block:'start'}),60);
  };
  const pickK=k=>{
    if(done)return;
    if(batch){if(P[q.id]===k){delete P[q.id];save();paintSel(0);refreshSend();return;} // もう一度押すと選択解除
      P[q.id]=k;save();paintSel(k);midBatch();
      if(next&&ui.autoNext)setTimeout(()=>go(next),250);
      return;}
    record(q,k);save();reveal(k);
  };
  const bindBtns=()=>btns().forEach(b=>b.onclick=()=>pickK(+b.dataset.k));
  bindBtns();
  INK.reset(q.id);
  const mountQ=()=>{const pg=document.querySelector('#qwrap .page');attachInk(pg,qImg(q).src);};
  mountQ();
  // 画面の向きが変わったら問題ページだけ差し替える（解答状態・書き込みは保持）
  onOrient=()=>{const sel=[...btns()].map(b=>b.className);document.getElementById('qwrap').innerHTML=qPageHtml(q);
    const nb=[...document.querySelectorAll('#qwrap [data-k]')];nb.forEach(b=>{const m=[...btns()].find(x=>x.closest('.choices')&&x.dataset.k===b.dataset.k);if(m)b.className='spot '+[...m.classList].filter(x=>x!=='').join(' ');});
    bindBtns();mountQ();};
  if(batch){paintSel(P[q.id]||0);midBatch();}
  const sk=document.getElementById('skip');
  sk.onclick=()=>{if(!done){delete P[q.id];save();reveal(null);refreshSend();}};
  document.getElementById('fitBtn').onclick=()=>{ui.wide=!ui.wide;save();document.getElementById('fitBtn').textContent=ui.wide?'全体':'拡大';onOrient();};
  document.onkeydown=e=>{if(dlg.open)return;const d=parseInt(e.key);if(d>=1&&d<=N)pickK(d);else if(e.key==='ArrowRight')go(next);else if(e.key==='ArrowLeft')go(prev);else if(e.key==='Enter'&&batch&&Object.keys(P).length)submitAll();};
  window.scrollTo(0,0);
}
function record(q,k){const r=S[q.id]||{n:0};r.n++;r.r=k==q.ans;r.k=k;r.at=Date.now();S[q.id]=r;}

// ---- 送信・採点
function submitAll(){
  const ids=Object.keys(P).filter(id=>QMAP[id]);
  if(!ids.length)return;
  ids.sort((a,b)=>{const[x1,y1]=a.split('-').map(Number),[x2,y2]=b.split('-').map(Number);return x1-x2||y1-y2;});
  LAST=ids.map(id=>{const q=QMAP[id],k=P[id];record(q,k);return{id,k,ok:k==q.ans};});
  P={};save();
  if(location.hash==='#/result')result();else location.hash='#/result';
}
function result(){
  setHead('採点結果',true);
  if(!LAST.length){$app.innerHTML='<div class="card empty">まだ送信した解答はありません</div>';return;}
  const ok=LAST.filter(x=>x.ok).length,wrong=LAST.filter(x=>!x.ok).map(x=>QMAP[x.id]).filter(Boolean);
  $app.innerHTML=`<div class="card" style="margin-bottom:12px"><div class="row" style="justify-content:space-between">
    <div><div class="muted" style="font-size:13px">採点結果</div><div class="score"><span id="scoreN">0</span><span style="font-size:22px"> / ${LAST.length}問</span></div><div class="muted">正答率 ${Math.round(ok/LAST.length*100)}%</div></div>
    <div class="row"><button class="btn" id="redo" ${wrong.length?'':'disabled'}>間違えた${wrong.length}問を解き直す</button><button class="btn sec" id="openAll">解説をすべて開く</button><a class="btn sec" href="#/">ホームへ</a></div></div>
    <div style="margin-top:10px">${bar({ok,ng:LAST.length-ok,total:LAST.length},10)}</div></div>
    <div class="res">${LAST.map(x=>{const q=QMAP[x.id];if(!q)return'';return `<details class="L${q.line}" ${x.ok?'':'open'}><summary><span class="mk ${x.ok?'ok':'ng'}">${x.ok?'○':'×'}</span><b>${q.id}</b><span class="tt">${esc(q.title||'')}</span>
      <span class="aa">あなた <b class="${x.ok?'ok':'ng'}">${CIRC[x.k-1]}</b> ／ 正解 <b>${CIRC[q.ans-1]}</b></span><a class="pill" href="${qurl(q)}" style="padding:4px 10px;font-size:12px" onclick="event.stopPropagation()">問題</a></summary>
      <div class="page"><img loading="lazy" src="${q.a}.webp" alt="解説 ${q.id}"></div></details>`}).join('')}</div>`;
  document.getElementById('redo').onclick=()=>startQueue(wrong);
  countUp(document.getElementById('scoreN'),ok);
  $app.querySelector('.res').classList.add('stg');
  document.getElementById('openAll').onclick=()=>$app.querySelectorAll('details').forEach(d=>d.open=true);
  window.scrollTo(0,0);
}

// ---- アカウント・サーバー保存（Supabase）
let USER=null, syncState='', syncTimer=null;
const adlg=document.getElementById('adlg');
function snapshot(){return {S,P,LAST,target:ui.target,grade:ui.grade,updatedAt:Date.now()};}
function mergeCloud(d){ // サーバーのデータと端末のデータを合わせる（問題ごとに新しい方）
  if(!d)return false;let changed=false;
  for(const [id,r] of Object.entries(d.S||{})){const l=S[id];if(!l||(r.at||0)>(l.at||0)){S[id]=r;changed=true;}}
  for(const [id,k] of Object.entries(d.P||{})){if(!(id in P)&&!(S[id]&&(S[id].at||0)>(d.updatedAt||0))){P[id]=k;changed=true;}}
  if((!LAST.length&&d.LAST&&d.LAST.length)){LAST=d.LAST;changed=true;}
  return changed;
}
function cloudSchedule(){
  if(!USER||!window.Cloud)return;
  clearTimeout(syncTimer);setSync('保存待ち…');
  syncTimer=setTimeout(async()=>{try{await Cloud.push(USER.uid,snapshot());setSync('サーバーに保存済み');}catch(e){setSync('保存に失敗（再接続時に再送）');console.error(e);}},1200);
}
function setSync(t){syncState=t;const el=document.getElementById('syncMsg');if(el)el.textContent=t;}
function paintAcct(){
  const b=document.getElementById('acct');
  b.textContent=USER?'👤 '+USER.label:'👤 ログイン';
}
async function pullAndMerge(){
  if(!USER||!window.Cloud)return;
  try{setSync('サーバーから読み込み中…');const d=await Cloud.pull(USER.uid);
    const ch=mergeCloud(d);store(KEY,S);store(KEY+'-pending',P);store(KEY+'-last',LAST);
    await Cloud.push(USER.uid,snapshot());setSync('サーバーと同期済み');if(ch&&!dlg.open&&!adlg.open)route();}
  catch(e){setSync('同期に失敗しました');console.error(e);}
}
window.onCloudUser=u=>{USER=u?{uid:u.uid,label:u.label}:null;paintAcct();if(USER)pullAndMerge();if(adlg.open)openAcct();};
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')pullAndMerge();});
const toEmail=id=>id.includes('@')?id.trim():id.trim().toLowerCase()+'@users.geo-gokaku.app';
const errJa=e=>{const c=(e&&e.code)||'';return ({'auth/invalid-credential':'ユーザー名かパスワードが違います','auth/wrong-password':'パスワードが違います','auth/user-not-found':'そのアカウントはありません','auth/email-already-in-use':'そのユーザー名（メール）はもう使われています','auth/weak-password':'パスワードは6文字以上にしてください','auth/invalid-email':'ユーザー名に使えない文字があります（英数字・-・_ がおすすめ）','auth/too-many-requests':'試行回数が多すぎます。少し待ってください','auth/network-request-failed':'ネットにつながっていません','invalid_credentials':'ユーザー名かパスワードが違います','user_already_exists':'そのユーザー名（メール）はもう使われています','weak_password':'パスワードは6文字以上にしてください','email_address_invalid':'ユーザー名に使えない文字があります（英数字・-・_ がおすすめ）','over_request_rate_limit':'試行回数が多すぎます。少し待ってください','over_email_send_rate_limit':'メール送信の回数制限です。少し待ってください','email_not_confirmed':'メールの確認がまだです。確認メールのリンクを開いてください','confirm':(e&&e.message)})[c]||(c==='confirm'?e.message:'エラー：'+(e&&e.message||e));};

    body.innerHTML=`<h2>アカウント</h2><p style="margin:0 0 6px"><b style="font-size:18px">${esc(USER.label)}</b> でログイン中</p>

      <div class="sync" id="syncMsg">${esc(syncState)}</div>
      <div class="row" style="justify-content:space-between;margin-top:16px"><button class="btn sec" id="logout">ログアウト</button><div class="row"><button class="btn sec" id="syncNow">今すぐ同期</button><button class="btn" data-x>閉じる</button></div></div>`;

  }else{
    body.innerHTML=`<h2>ログイン / アカウント作成</h2>
      <p class="muted" style="font-size:13px;margin:0 0 12px">アカウントを作ると、解いた記録がサーバーに保存され、スマホ・iPad・PCどれからでも続きができます。今この端末にある記録も引き継がれます。</p>
      <label class="fld"><span>ユーザー名（またはメールアドレス）</span><input id="aid" autocomplete="username" autocapitalize="off" spellcheck="false" placeholder="例：taro2026"></label>
      <label class="fld"><span>パスワード（6文字以上）</span><input id="apw" type="password" autocomplete="current-password"></label>
      <div class="msg ng" id="amsg"></div>
      <div class="row" style="justify-content:space-between;margin-top:8px"><button class="btn sec" data-x>閉じる</button><div class="row"><button class="btn sec" id="signup">新しく作る</button><button class="btn" id="login">ログイン</button></div></div>
      <p class="muted" style="font-size:12px;margin:12px 0 0">※ユーザー名で作った場合、パスワードを忘れると復旧できません。メールアドレスで作るとパスワード再設定ができます。<a href="#" id="reset">パスワードを忘れた（メールのみ）</a></p>`;
    const id=()=>body.querySelector('#aid').value,pw=()=>body.querySelector('#apw').value,msg=t=>body.querySelector('#amsg').textContent=t;
    const run=async(fn,label)=>{if(!id().trim()||!pw()){msg('ユーザー名とパスワードを入れてください');return;}msg(label+'中…');
      try{await fn(toEmail(id()),pw());}catch(e){msg(errJa(e));}};
    body.querySelector('#login').onclick=()=>run(Cloud.login,'ログイン');
    body.querySelector('#signup').onclick=()=>run(Cloud.signup,'作成');
    body.querySelector('#apw').onkeydown=e=>{if(e.key==='Enter')body.querySelector('#login').click();};
    body.querySelector('#reset').onclick=async e=>{e.preventDefault();if(!id().includes('@')){msg('パスワード再設定はメールアドレスで作ったアカウントのみです');return;}
      try{await Cloud.reset(id().trim());msg('再設定メールを送りました');}catch(er){msg(errJa(er));}};
  }
  body.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>adlg.close());
  if(!adlg.open)adlg.showModal();
}
document.getElementById('acct').onclick=openAcct;
adlg.addEventListener('close',()=>route());

// ---- ページの向き（縦＝A4版／横＝iPad版）
let onOrient=null;
const mqPort=matchMedia('(orientation: portrait)');
const isPort=()=>ui.view==='port'||(ui.view!=='land'&&mqPort.matches);
function qImg(q){const p=isPort()&&q.pq;return {src:p?q.pq:q.q,spots:(p?q.spotsP:q.spots)||[],port:!!p};}
function sumPages(c){const p=isPort()&&c.summaryP&&c.summaryP.length;return {list:p?c.summaryP:c.summary,port:!!p};}
// ページの余白を切り落として画面に収める（t,b,l,r＝上下左右の切り落とし割合）
const CROP={land:{t:.05,b:.055,l:.035,r:.035,ar:841.92/594.96},port:{t:.03,b:.035,l:.05,r:.05,ar:594.96/841.92}};
function qPageHtml(q){const im=qImg(q),C=CROP[im.port?'port':'land'];
  const kw=1-C.l-C.r,kh=1-C.t-C.b,ar=C.ar*kw/kh,f=n=>+n.toFixed(3);
  const imgCss=`width:${f(100/kw)}%;left:${f(-C.l/kw*100)}%;top:${f(-C.t/kh*100)}%`;
  const cls=ui.wide?'wide':'fit';
  return `<div class="page ${cls}" style="--ar:${f(ar)};${ui.wide?'aspect-ratio:'+f(ar):''}"><img src="${im.src}.webp" alt="問題 ${q.id}" style="${imgCss}">${im.spots.map(s=>`<button class="spot" data-k="${s.k}" aria-label="${CIRC[s.k-1]}" style="left:${f((s.x/100-C.l)/kw*100)}%;top:${f((s.y/100-C.t)/kh*100)}%;width:${f(s.w/kw)}%;height:${f(s.h/kh)}%"></button>`).join('')}</div>`;}
let lastPort=isPort();
function orientChanged(){const p=isPort();if(p===lastPort)return;lastPort=p;
  if(dlg.open||adlg.open)return;
  if(onOrient)onOrient();else if(!location.hash.startsWith('#/print'))route();}
mqPort.addEventListener?mqPort.addEventListener('change',orientChanged):mqPort.addListener(orientChanged);
dlg.addEventListener('close',()=>{lastPort=isPort();});

// ---- その場だけの書き込み（サーバー・端末どちらにも保存しない）
const INK=(()=>{
  const st={on:false,tool:'pen',color:'#d23c3c',finger:false,qid:null,strokes:{},canv:[]};
  const COLORS=['#1d2b30','#d23c3c','#1f6fb5'];
  const bar=document.createElement('div');bar.className='inkbar';bar.style.display='none';
  bar.innerHTML=`<button data-a="toggle" title="書き込み">✏️</button><div class="tools">
    <hr><button data-tool="pen" title="ペン">🖊</button><button data-tool="marker" title="マーカー">🖍</button><button data-tool="eraser" title="消しゴム">🧽</button>
    <hr>${COLORS.map(c=>`<button data-color="${c}" title="色"><span class="dot" style="background:${c}"></span></button>`).join('')}
    <hr><button data-a="undo" title="ひとつ戻す">↶</button><button data-a="clear" title="全部消す">🗑</button>
    <button data-a="finger" title="指でも書く">☝<small></small></button></div>`;
  document.body.appendChild(bar);
  const paint=()=>{bar.querySelector('[data-a=toggle]').classList.toggle('on',st.on);document.body.classList.toggle('inking',st.on);
    bar.querySelectorAll('[data-tool]').forEach(b=>b.classList.toggle('on',b.dataset.tool===st.tool));
    bar.querySelectorAll('[data-color]').forEach(b=>b.classList.toggle('on',b.dataset.color===st.color));
    const f=bar.querySelector('[data-a=finger]');f.classList.toggle('on',st.finger);f.querySelector('small').textContent=st.finger?'指OK':'ペンのみ';};
  bar.onclick=e=>{const b=e.target.closest('button');if(!b)return;
    if(b.dataset.tool)st.tool=b.dataset.tool;
    else if(b.dataset.color){st.color=b.dataset.color;if(st.tool==='eraser')st.tool='pen';}
    else if(b.dataset.a==='toggle')st.on=!st.on;
    else if(b.dataset.a==='finger')st.finger=!st.finger;
    else if(b.dataset.a==='undo'){let best=null,key=null;for(const [k,a] of Object.entries(st.strokes)){const t=a.length&&a[a.length-1].t;if(t&&(!best||t>best)){best=t;key=k;}}if(key){st.strokes[key].pop();redrawAll();}}
    else if(b.dataset.a==='clear'){if(Object.values(st.strokes).some(a=>a.length)&&confirm('書き込みを全部消しますか？')){st.strokes={};redrawAll();}}
    paint();};
  const redrawAll=()=>st.canv=st.canv.filter(c=>{if(!c.cv.isConnected)return false;c.draw();return true;});
  paint();
  return {st,COLORS,redrawAll,
    show(v){bar.style.display=v?'flex':'none';if(!v)document.body.classList.remove('inking');else paint();},
    reset(qid){if(st.qid!==qid){st.qid=qid;st.strokes={};}this.show(true);}};
})();
function attachInk(pageEl,key){
  if(!pageEl)return;
  const st=INK.st;const cv=document.createElement('canvas');cv.className='ink';pageEl.appendChild(cv);
  const ctx=cv.getContext('2d');
  const list=()=>st.strokes[key]||(st.strokes[key]=[]);
  const size=()=>{const r=pageEl.getBoundingClientRect(),d=window.devicePixelRatio||1;cv.width=Math.round(r.width*d);cv.height=Math.round(r.height*d);draw();};
  const drawStroke=s=>{const W=cv.width,H=cv.height;if(s.pts.length<1)return;
    ctx.save();ctx.lineCap='round';ctx.lineJoin='round';
    if(s.tool==='marker'){ctx.globalAlpha=.32;ctx.strokeStyle=s.color==='#1d2b30'?'#f2c200':s.color;}else ctx.strokeStyle=s.color;
    const base=s.w*W/1000;
    ctx.beginPath();ctx.moveTo(s.pts[0][0]*W,s.pts[0][1]*H);
    if(s.tool==='marker'||s.pts.length<3){ctx.lineWidth=base;for(const p of s.pts)ctx.lineTo(p[0]*W,p[1]*H);ctx.stroke();}
    else{for(let i=1;i<s.pts.length;i++){const a=s.pts[i-1],b=s.pts[i];ctx.beginPath();ctx.lineWidth=base*(0.55+(b[2]??0.5));ctx.moveTo(a[0]*W,a[1]*H);ctx.lineTo(b[0]*W,b[1]*H);ctx.stroke();}}
    ctx.restore();};
  const draw=()=>{ctx.clearRect(0,0,cv.width,cv.height);list().forEach(drawStroke);};
  const entry={cv,draw};INK.st.canv.push(entry);
  new ResizeObserver(size).observe(pageEl);size();
  let cur=null,scrollY0=null;
  const pos=e=>{const r=cv.getBoundingClientRect();return [(e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height,e.pointerType==='pen'?(e.pressure||0.5):0.5];};
  const erase=p=>{const a=list(),R=0.018;const n=a.length;st.strokes[key]=a.filter(s=>!s.pts.some(q=>Math.hypot(q[0]-p[0],(q[1]-p[1])*cv.height/cv.width)<R));if(st.strokes[key].length!==n)draw();};
  cv.addEventListener('pointerdown',e=>{
    if(!st.on)return;
    if(e.pointerType==='touch'&&!st.finger){scrollY0=e.clientY;cv.setPointerCapture(e.pointerId);return;} // 指はスクロール
    e.preventDefault();cv.setPointerCapture(e.pointerId);const p=pos(e);
    if(st.tool==='eraser'){cur={eraser:true};erase(p);return;}
    cur={tool:st.tool,color:st.color,w:st.tool==='marker'?14:2.6,pts:[p],t:Date.now()};list().push(cur);});
  cv.addEventListener('pointermove',e=>{
    if(scrollY0!=null){window.scrollBy(0,scrollY0-e.clientY);scrollY0=e.clientY;return;}
    if(!cur)return;e.preventDefault();
    const evs=e.getCoalescedEvents?e.getCoalescedEvents():[e];
    if(cur.eraser){evs.forEach(ev=>erase(pos(ev)));return;}
    evs.forEach(ev=>cur.pts.push(pos(ev)));draw();});
  const end=()=>{cur=null;scrollY0=null;};
  cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',end);
}

// ---- 印刷用
function openPrint(c){
  const body=document.getElementById('adlgBody');
  const tq=c.questions.filter(inTarget);
  body.innerHTML=`<h2>第${c.ch}章を印刷</h2><p class="muted" style="font-size:13px;margin:0 0 12px">A4で印刷します（問題・まとめはA4縦、解説はA4横）。</p>
    <div style="display:grid;gap:8px">
    <a class="btn" href="#/print/${c.ch}/q/t">問題（${ui.target?ui.target+'割目標の':''}${tq.length}問）</a>
    ${ui.target?`<a class="btn sec" href="#/print/${c.ch}/q/all">問題（全${c.questions.length}問）</a>`:''}
    <a class="btn sec" href="#/print/${c.ch}/sum/all">まとめ（${c.summary.length}ページ）</a>
    <a class="btn sec" href="#/print/${c.ch}/ans/t">解説（${tq.length}問）</a></div>
    <div class="row" style="justify-content:flex-end;margin-top:14px"><button class="btn sec" data-x>閉じる</button></div>`;
  body.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>adlg.close());
  body.querySelectorAll('a').forEach(a=>a.addEventListener('click',()=>adlg.close()));
  adlg.showModal();
}
function printView(c,what,range){
  const qs=range==='all'?c.questions:c.questions.filter(inTarget);
  let pages=[];
  if(what==='q')pages=qs.map(q=>q.pq?{src:q.pq,P:1}:{src:q.q,P:0});
  else if(what==='sum')pages=(c.summaryP&&c.summaryP.length?c.summaryP.map(s=>({src:s,P:1})):c.summary.map(s=>({src:s,P:0})));
  else pages=qs.map(q=>({src:q.a,P:0}));
  const label={q:'問題',sum:'まとめ',ans:'解説'}[what];
  setHead(`印刷：第${c.ch}章 ${label}`,true);
  $app.innerHTML=`<div class="card noprint" style="margin-bottom:14px"><div class="row" style="justify-content:space-between">
    <div><b>${label} ${pages.length}ページ</b><div class="muted" style="font-size:13px" id="pst">画像を読み込み中…</div></div>
    <div class="row"><a class="btn sec" href="#/ch/${c.ch}">戻る</a><button class="btn" id="doPrint" disabled>🖨 印刷する</button></div></div></div>
    ${pages.map(p=>`<div class="pp ${p.P?'P':'L'}"><img src="${p.src}.webp" alt=""></div>`).join('')}`;
  const imgs=[...$app.querySelectorAll('.pp img')];let n=0;
  const ready=()=>{document.getElementById('pst').textContent='準備できました';document.getElementById('doPrint').disabled=false;};
  imgs.forEach(im=>{if(im.complete)n++;else im.onload=im.onerror=()=>{if(++n>=imgs.length)ready();};});
  if(n>=imgs.length)ready();
  document.getElementById('doPrint').onclick=()=>window.print();
  window.scrollTo(0,0);
}

// ---- モーション補助
let NAVDIR='';
const reduce=matchMedia('(prefers-reduced-motion: reduce)');
function animateIn(dir){
  if(reduce.matches)return;
  $app.classList.remove('enter','enter-next','enter-prev');void $app.offsetWidth;
  $app.classList.add(dir==='next'?'enter-next':dir==='prev'?'enter-prev':'enter');
  $app.querySelectorAll('.qgrid,.chgrid').forEach(g=>{g.classList.add('stg');[...g.children].forEach((el,i)=>el.style.setProperty('--d',Math.min(i*0.018,0.5)+'s'));});
  $app.querySelectorAll('.res').forEach(g=>[...g.children].forEach((el,i)=>el.style.setProperty('--d',Math.min(i*0.04,0.6)+'s')));
}
function sparks(el){
  if(!el||reduce.matches)return;
  const cols=['#2e9e4f','#f0a531','#1f6fb5','#7b4fb5','#e05d5d'];
  for(let i=0;i<14;i++){const sp=document.createElement('i');sp.className='spark';const a=Math.PI*2*i/14+Math.random()*.4,r=38+Math.random()*34;
    sp.style.cssText=`background:${cols[i%cols.length]};--dx:${Math.cos(a)*r}px;--dy:${Math.sin(a)*r}px;animation-delay:${Math.random()*.08}s`;el.appendChild(sp);setTimeout(()=>sp.remove(),900);}
}
function countUp(el,to){if(!el)return;if(reduce.matches||!to){el.textContent=to;return;}const t0=performance.now(),D=Math.min(900,300+to*40);
  const f=t=>{const p=Math.min(1,(t-t0)/D),e=1-Math.pow(1-p,3);el.textContent=Math.round(to*e);if(p<1)requestAnimationFrame(f);};requestAnimationFrame(f);}
// 画像はふわっと表示
new MutationObserver(ms=>ms.forEach(m=>m.addedNodes.forEach(n=>{if(n.nodeType!==1)return;(n.tagName==='IMG'?[n]:n.querySelectorAll('img')).forEach(im=>{
  if(im.complete&&im.naturalWidth)im.classList.add('ld');else{im.addEventListener('load',()=>im.classList.add('ld'),{once:true});im.addEventListener('error',()=>im.classList.add('ld'),{once:true});}});}))).observe(document.body,{childList:true,subtree:true});

// ---- ルーター
function route(anim){
  routeInner();
  if(anim)animateIn(NAVDIR);
  NAVDIR='';
}
function routeInner(){
  document.onkeydown=null;onOrient=null;INK.show(false);
  const h=location.hash.replace(/^#\/?/,'').split('/');
  if(h[0]==='result')return result();
  if(h[0]==='print'){const c=BOOK.find(x=>x.ch==h[1]);if(c)return printView(c,h[2],h[3]);}
  if(h[0]==='ch'){const c=BOOK.find(x=>x.ch==h[1]);if(!c)return home();
    if(h[2]==='q')return question(c,h[3]);
    queue=null;window.scrollTo(0,0);
    return chapter(c,h[2]==='sum'?'sum':'q');}
  queue=null;home();window.scrollTo(0,0);
}
addEventListener('hashchange',()=>route(true));route(true);
</script>
<script src="supabase-config.js"></script>
<script type="module">
// Supabase（アカウント・進捗のサーバー保存）。supabase-config.js が未設定なら何もしない
const cfg=window.SUPABASE_CONFIG||{};
window.Cloud={ready:false};
if(cfg.url&&cfg.anonKey){
  try{
    const {createClient}=await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/+esm');
    const sb=createClient(cfg.url,cfg.anonKey,{auth:{persistSession:true,autoRefreshToken:true}});
    const chk=({data,error})=>{if(error)throw error;return data;};
    window.Cloud={ready:true,
      login:async(e,p)=>chk(await sb.auth.signInWithPassword({email:e,password:p})),
      signup:async(e,p)=>{const d=chk(await sb.auth.signUp({email:e,password:p}));
        if(!d.session)throw {code:'confirm',message:'確認メールを送りました。メール内のリンクを開いてからログインしてください。'};return d;},
      logout:async()=>chk(await sb.auth.signOut()),
      reset:async e=>chk(await sb.auth.resetPasswordForEmail(e,{redirectTo:location.origin+location.pathname})),
      pull:async uid=>{const d=chk(await sb.from('progress').select('data').eq('user_id',uid).maybeSingle());return d?d.data:null;},
      push:async(uid,data)=>chk(await sb.from('progress').upsert({user_id:uid,data,updated_at:new Date().toISOString()})),
    };
    let last=null;
    const fire=u=>{const id=u?u.id:null;if(id===last)return;last=id;
      window.onCloudUser(u?{uid:u.id,label:(u.email||'').replace(/@users\.geo-gokaku\.app$/,'')}:null);};
    sb.auth.onAuthStateChange((_ev,session)=>fire(session?session.user:null));
    const {data:{session}}=await sb.auth.getSession();fire(session?session.user:null);
  }catch(e){console.error(e);window.Cloud={ready:false,error:'サーバーに接続できませんでした：'+(e.message||e)};}
}
</script>
