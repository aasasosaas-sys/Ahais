<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>地理 合格ライン問題集</title>
<style>
:root{
  --bg:#f3f6f7; --card:#fff; --ink:#1d2b30; --sub:#5d6f75; --line:#dbe3e6;
  --main:#0f5f6e; --main2:#e3f0f2; --pick:#1f6fb5; --pickbg:#e6f0fa;
  --ok:#2e9e4f; --ng:#d23c3c; --okbg:#e7f6ec; --ngbg:#fde9e9; --hdr:#0f5f6e;
  --l6:#1f6fb5; --l7:#2e9e4f; --l8:#7b4fb5; --l9:#c8302f;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#0f1719; --card:#182326; --ink:#e4ecee; --sub:#9db0b5; --line:#2a3a3e;
    --main:#4fb3c4; --main2:#1c3236; --pickbg:#16283a; --okbg:#173023; --ngbg:#3a1c1c; --hdr:#123d45; }
}
:root[data-theme="dark"]{ --bg:#0f1719; --card:#182326; --ink:#e4ecee; --sub:#9db0b5; --line:#2a3a3e;
  --main:#4fb3c4; --main2:#1c3236; --pickbg:#16283a; --okbg:#173023; --ngbg:#3a1c1c; --hdr:#123d45; }
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic",system-ui,sans-serif;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{opacity:.4;cursor:default}
a{color:inherit}
header{position:sticky;top:0;z-index:30;background:var(--hdr);color:#fff;display:flex;align-items:center;gap:8px;padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top))}
header .t{font-weight:800;font-size:17px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header button{background:rgba(255,255,255,.16);border:0;border-radius:8px;padding:6px 11px;color:#fff;font-size:14px;white-space:nowrap}
header #send{background:#f0a531;color:#1d2b30;font-weight:800}
main{max-width:1180px;margin:0 auto;padding:16px}
.muted{color:var(--sub)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
h3.sec{margin:18px 0 8px;font-size:15px;color:var(--sub)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:2px solid var(--line);background:var(--card);border-radius:12px;padding:8px 14px;font-weight:700;font-size:15px;display:flex;flex-direction:column;align-items:center;min-width:76px}
.seg button small{font-weight:500;font-size:11.5px;color:var(--sub)}
.seg button.on{border-color:var(--main);background:var(--main2)}
.seg button.on.T6{border-color:var(--l6)}.seg button.on.T7{border-color:var(--l7)}.seg button.on.T8{border-color:var(--l8)}.seg button.on.T9{border-color:var(--l9)}
.chgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.ch{display:block;text-decoration:none}
.ch h3{margin:2px 0 6px;font-size:18px}
.ch .no{color:var(--main);font-weight:800;font-size:13px}
.bar{height:8px;border-radius:5px;background:var(--main2);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.stats{display:flex;gap:14px;font-size:13px;margin-top:8px;flex-wrap:wrap}
.tabs{display:flex;gap:6px;margin:4px 0 14px;flex-wrap:wrap}
.pill{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 14px;font-size:14px;text-decoration:none;display:inline-block}
.pill.on{background:var(--main);border-color:var(--main);color:#fff}
.qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:8px}
.q{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--l6);border-radius:9px;padding:8px 10px;text-decoration:none;min-height:46px}
.q b{font-size:14px;white-space:nowrap}
.q span{font-size:12.5px;color:var(--sub);flex:1;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.q em{font-style:normal;font-weight:800;min-width:22px;text-align:center}
.L6{border-left-color:var(--l6)}.L7{border-left-color:var(--l7)}.L8{border-left-color:var(--l8)}.L9{border-left-color:var(--l9)}
.ok{color:var(--ok)}.ng{color:var(--ng)}.pk{color:var(--pick)}
.lbadge{display:inline-block;color:#fff;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700;white-space:nowrap}
.B6{background:var(--l6)}.B7{background:var(--l7)}.B8{background:var(--l8)}.B9{background:var(--l9)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:0;border-radius:10px;padding:10px 16px;background:var(--main);color:#fff;font-weight:700;font-size:15px;text-decoration:none;display:inline-block}
:root[data-theme="dark"] .btn{color:#0f1719}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn{color:#0f1719}}
.btn.sec{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.send{background:#f0a531;color:#1d2b30}
.page{position:relative;background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.12);line-height:0}
.page img{width:100%;height:auto;display:block}
.spot{position:absolute;border-radius:8px;border:2px solid transparent;background:transparent;padding:0;transition:background .15s}
@media (hover:hover){.spot:hover{background:rgba(15,95,110,.10);border-color:rgba(15,95,110,.4)}}
.spot.sel{background:rgba(31,111,181,.16);border-color:var(--pick)}
.spot.pick{background:rgba(210,60,60,.15);border-color:var(--ng)}
.spot.right{background:rgba(46,158,79,.18);border-color:var(--ok)}
.port{max-width:820px;margin:0 auto}
.ansbar{position:sticky;bottom:0;z-index:15;margin:12px -16px 0;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:color-mix(in srgb,var(--bg) 90%,transparent);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-top:1px solid var(--line)}
.choices{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.choices button{min-width:54px;height:50px;border-radius:12px;border:2px solid var(--line);background:var(--card);font-size:22px;font-weight:700}
.choices button.sel{border-color:var(--pick);background:var(--pickbg);color:var(--pick)}
.choices button.right{border-color:var(--ok);background:var(--okbg);color:var(--ok)}
.choices button.pick{border-color:var(--ng);background:var(--ngbg);color:var(--ng)}
.verdict{display:flex;align-items:center;gap:12px;border-radius:12px;padding:12px 16px;margin:12px 0;font-weight:800;font-size:20px;flex-wrap:wrap}
.verdict.ok{background:var(--okbg)}.verdict.ng{background:var(--ngbg)}.verdict.nt{background:var(--main2)}
.verdict small{font-weight:500;font-size:14px;color:var(--ink)}
.nav{display:flex;gap:8px;justify-content:space-between;align-items:center;margin-top:8px}
.nav .mid{flex:1;display:flex;justify-content:center;gap:8px;flex-wrap:wrap;text-align:center;font-size:13px}
.qhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.qhead h2{margin:0;font-size:22px}
.sum .page{margin-bottom:14px}
#result{scroll-margin-top:64px}
.empty{padding:30px;text-align:center}
.res{display:grid;gap:8px}
.res details{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--l6);border-radius:10px}
.res summary{display:flex;align-items:center;gap:10px;padding:10px 12px;cursor:pointer;list-style:none;flex-wrap:wrap}
.res summary::-webkit-details-marker{display:none}
.res summary .mk{font-size:22px;font-weight:900;width:26px;text-align:center}
.res summary .tt{flex:1;min-width:150px;font-size:13.5px}
.res summary .aa{font-size:13.5px;white-space:nowrap}
.res details[open] summary{border-bottom:1px solid var(--line)}
.res details .page{margin:10px;border-radius:8px}
.score{font-size:44px;font-weight:900;line-height:1}
dialog{border:0;border-radius:16px;padding:0;max-width:520px;width:calc(100% - 32px);background:var(--card);color:var(--ink);box-shadow:0 10px 40px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(0,0,0,.4)}
.dlg{padding:18px}
.dlg h2{margin:0 0 12px;font-size:19px}
.opt{display:flex;gap:10px;align-items:flex-start;border:2px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;cursor:pointer}
.opt.on{border-color:var(--main);background:var(--main2)}
.opt b{display:block}
.opt span{font-size:13px;color:var(--sub)}
@media (max-width:600px){ main{padding:12px} .ansbar{margin:12px -12px 0} .qhead h2{font-size:19px} .choices button{min-width:44px;height:46px;font-size:20px} header .t{font-size:15px} .seg button{min-width:0;flex:1;padding:8px 6px} }
</style>
</head>
<body>
<header>
  <button id="back" style="display:none">‹ 戻る</button>
  <div class="t" id="title">地理 合格ライン問題集</div>
  <button id="send" style="display:none">解答を送信</button>
  <button id="gear" title="設定">⚙ 設定</button>
</header>
<main id="app"></main>

<dialog id="dlg"><div class="dlg">
  <h2>設定</h2>
  <h3 class="sec" style="margin-top:0">採点のしかた</h3>
  <label class="opt" data-grade="batch"><input type="radio" name="g"><div><b>まとめて採点（送信ボタン）</b><span>選択肢を選んでおき、「解答を送信」を押すと、解いた問題の正解・解説がまとめて出ます。選び直しもOK。</span></div></label>
  <label class="opt" data-grade="instant"><input type="radio" name="g"><div><b>その場で採点</b><span>選択肢を押した瞬間に正解・解説が出ます。</span></div></label>
  <h3 class="sec">何割目標</h3>
  <div class="seg" id="dlgTarget"></div>
  <p class="muted" style="font-size:12.5px;margin:8px 0 0">目標の割合に必要な問題だけを出題します（例：7割目標＝6割ライン＋7割ラインの問題）。</p>
  <h3 class="sec">表示</h3>
  <div class="row"><button class="pill" data-th="">自動</button><button class="pill" data-th="light">ライト</button><button class="pill" data-th="dark">ダーク</button></div>
  <div class="row" style="justify-content:flex-end;margin-top:16px"><button class="btn" id="dlgClose">閉じる</button></div>
</div></dialog>

<script src="data.js"></script>
<script>
const CIRC="①②③④⑤⑥⑦⑧⑨";
const BOOK=window.BOOK||[];
const ALLQ=BOOK.flatMap(c=>c.questions.map(q=>(q.ch=c.ch,q)));
const QMAP=Object.fromEntries(ALLQ.map(q=>[q.id,q]));
const $app=document.getElementById('app');
const KEY='geo-gokaku-v1';
const load=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}};
const store=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
let S=load(KEY,{});            // 解答記録 {id:{r:bool,k:選んだ番号,n:回数,at}}
let P=load(KEY+'-pending',{});  // 送信前の選択 {id:k}
let ui=Object.assign({target:0,grade:'batch',mode:'all',theme:''},load(KEY+'-ui',{}));
let LAST=load(KEY+'-last',[]);  // 直近の送信結果
const save=()=>{store(KEY,S);store(KEY+'-pending',P);store(KEY+'-ui',ui);store(KEY+'-last',LAST)};
let queue=null;
const TG=[[6,'6割'],[7,'7割'],[8,'8割'],[9,'9割'],[0,'全問']];
const inTarget=q=>!ui.target||(q.line||9)<=ui.target;
const res=id=>S[id];
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num=q=>q.id.split('-')[1];
const qurl=q=>`#/ch/${q.ch}/q/${num(q)}`;

// ---- テーマ
function applyTheme(){const r=document.documentElement;if(ui.theme)r.dataset.theme=ui.theme;else delete r.dataset.theme;}
applyTheme();

// ---- ヘッダー
document.getElementById('back').onclick=()=>{const h=location.hash.split('/');if(h[1]==='ch'&&h.length>3)location.hash=h.slice(0,3).join('/');else location.hash='#/';};
document.getElementById('send').onclick=()=>submitAll();
function setHead(t,back){
  document.getElementById('title').textContent=t;
  document.getElementById('back').style.display=back?'':'none';
  document.title=back?t+' | 地理 合格ライン':'地理 合格ライン問題集';
  refreshSend();
}
function refreshSend(){
  const n=Object.keys(P).length,b=document.getElementById('send');
  b.style.display=ui.grade==='batch'&&n?'':'none';b.textContent=`解答を送信（${n}）`;
  const s2=document.getElementById('send2');if(s2){s2.textContent=`解答を送信（${n}問）`;s2.disabled=!n;}
}

// ---- 設定
const dlg=document.getElementById('dlg');
function paintDlg(){
  dlg.querySelectorAll('[data-grade]').forEach(l=>{const on=l.dataset.grade===ui.grade;l.classList.toggle('on',on);l.querySelector('input').checked=on;});
  document.getElementById('dlgTarget').innerHTML=targetSeg();
  bindTarget(document.getElementById('dlgTarget'),paintDlg);
  dlg.querySelectorAll('[data-th]').forEach(b=>b.classList.toggle('on',b.dataset.th===ui.theme));
}
document.getElementById('gear').onclick=()=>{paintDlg();dlg.showModal();};
document.getElementById('dlgClose').onclick=()=>dlg.close();
dlg.addEventListener('close',()=>route());
dlg.querySelectorAll('[data-grade]').forEach(l=>l.onclick=e=>{e.preventDefault();
  if(l.dataset.grade==='instant'&&Object.keys(P).length&&confirm(`送信前の解答が${Object.keys(P).length}問あります。先に送信して採点しますか？`)){dlg.close();submitAll();return;}
  ui.grade=l.dataset.grade;save();paintDlg();});
dlg.querySelectorAll('[data-th]').forEach(b=>b.onclick=()=>{ui.theme=b.dataset.th;save();applyTheme();paintDlg();});
function targetSeg(){return TG.map(([t,l])=>`<button class="T${t} ${ui.target==t?'on':''}" data-t="${t}">${l}${t?'目標':''}<small>${ALLQ.filter(q=>!t||(q.line||9)<=t).length}問</small></button>`).join('');}
function bindTarget(el,after){el.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{ui.target=+b.dataset.t;save();after();});}

function stats(list){let ok=0,ng=0;list.forEach(q=>{const r=res(q.id);if(r)r.r?ok++:ng++;});return{ok,ng,total:list.length};}
function bar(s,h){const t=s.total||1;return `<div class="bar" style="${h?'height:'+h+'px':''}"><i style="width:${s.ok/t*100}%;background:var(--ok)"></i><i style="width:${s.ng/t*100}%;background:var(--ng)"></i></div>`;}
function startQueue(list){if(!list.length)return;queue=list.map(q=>q.id);location.hash=qurl(list[0]);}

// ---- ホーム
function home(){
  setHead('地理 合格ライン問題集 知識編',false);
  const tq=ALLQ.filter(inTarget),all=stats(tq);
  const wrong=tq.filter(q=>res(q.id)&&!res(q.id).r);
  const cards=BOOK.map(c=>{const l=c.questions.filter(inTarget),s=stats(l);
    return `<a class="card ch" href="#/ch/${c.ch}"><div class="no">第${c.ch}章</div><h3>${esc(c.name)}</h3>${bar(s)}
    <div class="stats"><span>${s.total}問${ui.target?`<span class="muted">／全${c.questions.length}</span>`:''}</span><span class="ok">○ ${s.ok}</span><span class="ng">× ${s.ng}</span></div></a>`}).join('');
  $app.innerHTML=`<div class="card" style="margin-bottom:14px">
    <b style="font-size:17px">何割目標？</b> <span class="muted" style="font-size:13px">目標に必要な問題だけを出題します</span>
    <div class="seg" id="tg" style="margin-top:10px">${targetSeg()}</div>
    <div class="row" style="margin-top:8px;font-size:12px"><span class="lbadge B6">6割ライン</span><span class="lbadge B7">7割ライン</span><span class="lbadge B8">8割ライン</span><span class="lbadge B9">9割ライン</span><span class="muted">問題の左端の色＝ライン</span></div>
  </div>
  <div class="card" style="margin-bottom:14px">
    <div class="row" style="justify-content:space-between"><div><b style="font-size:17px">${ui.target?ui.target+'割目標':'全問'}の進み具合</b><div class="muted" style="font-size:13px">${all.total}問中 ${all.ok+all.ng}問解いた／正解 ${all.ok}問</div></div>
    <div class="muted" style="font-size:13px">採点：<b>${ui.grade==='batch'?'まとめて採点（送信ボタン）':'その場で採点'}</b> <button class="pill" id="chg" style="padding:4px 10px;font-size:12px">変更</button></div></div>
    <div style="margin-top:10px">${bar(all,10)}</div>
    <div class="row" style="margin-top:12px">
      <button class="btn" id="todo">未回答を順に解く（${tq.filter(q=>!res(q.id)).length}）</button>
      <button class="btn sec" id="wrongAll" ${wrong.length?'':'disabled'}>間違えた問題（${wrong.length}）</button>
      <button class="btn sec" id="randAll">ランダム20問</button>
      ${LAST.length?'<a class="btn sec" href="#/result">前回の採点結果</a>':''}
    </div>
  </div>
  <div class="chgrid">${cards||'<div class="card empty">データがありません</div>'}</div>`;
  bindTarget(document.getElementById('tg'),home);
  document.getElementById('chg').onclick=()=>{paintDlg();dlg.showModal();};
  document.getElementById('todo').onclick=()=>startQueue(tq.filter(q=>!res(q.id)));
  document.getElementById('wrongAll').onclick=()=>startQueue(wrong);
  document.getElementById('randAll').onclick=()=>startQueue(tq.slice().sort(()=>Math.random()-.5).slice(0,20));
}

// ---- 章
function chapter(c,tab){
  setHead(`第${c.ch}章 ${c.name}`,true);
  const tl=c.questions.filter(inTarget);
  const filt=tl.filter(q=>ui.mode==='all'||(ui.mode==='todo'&&!res(q.id))||(ui.mode==='wrong'&&res(q.id)&&!res(q.id).r));
  const s=stats(tl);
  let body='';
  if(tab==='sum'){
    body=c.summary.length?`<div class="sum ${c.orient==='port'?'port':''}">${c.summary.map(p=>`<div class="page"><img loading="lazy" src="${p}.webp" alt="まとめページ"></div>`).join('')}</div>`:'<div class="card empty">まとめページはありません</div>';
  }else{
    body=`<div class="card" style="margin-bottom:12px;padding:12px">
      <div class="seg" id="tg">${TG.map(([t,l])=>`<button class="T${t} ${ui.target==t?'on':''}" data-t="${t}">${l}${t?'目標':''}<small>${c.questions.filter(q=>!t||(q.line||9)<=t).length}問</small></button>`).join('')}</div>
      <div class="row" style="margin-top:10px">${[['all','すべて'],['todo','未回答'],['wrong','間違い']].map(([m,t])=>`<button class="pill ${ui.mode==m?'on':''}" data-mode="${m}">${t}</button>`).join('')}
      <span class="muted" style="font-size:13px;margin-left:6px">○ ${s.ok}／× ${s.ng}／${s.total}問</span></div>
      <div class="row" style="margin-top:10px"><button class="btn" id="start" ${filt.length?'':'disabled'}>この${filt.length}問を順に解く</button><button class="btn sec" id="shuf" ${filt.length?'':'disabled'}>シャッフル</button>
      <button class="pill" id="reset" style="margin-left:auto;font-size:12px">この章の記録を消す</button></div></div>
    <div class="qgrid">${filt.map(q=>{const r=res(q.id),p=P[q.id];return `<a class="q L${q.line}" href="${qurl(q)}"><b>${q.id}</b><span>${esc(q.title||'')}</span><em class="${p?'pk':r?(r.r?'ok':'ng'):''}">${p?CIRC[p-1]:r?(r.r?'○':'×'):''}</em></a>`}).join('')||'<div class="card empty">該当する問題はありません</div>'}</div>`;
  }
  $app.innerHTML=`<div class="tabs"><a class="pill ${tab!=='sum'?'on':''}" href="#/ch/${c.ch}">演習</a><a class="pill ${tab==='sum'?'on':''}" href="#/ch/${c.ch}/sum">まとめ（${c.summary.length}p）</a>${c.ansTable?`<a class="pill" href="${c.ansTable}.webp" target="_blank">正解一覧</a>`:''}</div>${body}`;
  const tg=document.getElementById('tg');if(tg)bindTarget(tg,()=>chapter(c,tab));
  $app.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{ui.mode=b.dataset.mode;save();chapter(c,tab)});
  const st=document.getElementById('start'),sh=document.getElementById('shuf'),rs=document.getElementById('reset');
  if(st)st.onclick=()=>startQueue(filt);
  if(sh)sh.onclick=()=>startQueue(filt.slice().sort(()=>Math.random()-.5));
  if(rs)rs.onclick=()=>{if(confirm(`第${c.ch}章の解答記録を消しますか？`)){c.questions.forEach(q=>{delete S[q.id];delete P[q.id]});save();chapter(c,tab);}};
}

// ---- 問題
function question(c,n){
  const q=c.questions.find(x=>num(x)===n);
  if(!q){location.hash=`#/ch/${c.ch}`;return;}
  setHead(`${q.id} ${q.title||''}`,true);
  const list=queue&&queue.includes(q.id)?queue:c.questions.filter(inTarget).map(x=>x.id).concat(inTarget(q)?[]:[q.id]);
  const pos=list.indexOf(q.id),prev=QMAP[list[pos-1]],next=QMAP[list[pos+1]];
  const N=q.n||4, batch=ui.grade==='batch', r=res(q.id);
  $app.innerHTML=`<div class="qhead"><h2>${q.id}</h2>${q.line?`<span class="lbadge B${q.line}">${q.line}割ライン</span>`:''}<span class="muted" style="font-size:13px">${esc(q.src||'')}</span>
    <span class="muted" style="margin-left:auto;font-size:13px">${pos+1} / ${list.length}${r?` ・前回 <b class="${r.r?'ok':'ng'}">${r.r?'○':'×'}</b>`:''}</span></div>
    <div class="page ${c.orient==='port'?'port':''}"><img src="${q.q}.webp" alt="問題 ${q.id}">${(q.spots||[]).map(s=>`<button class="spot" data-k="${s.k}" aria-label="${CIRC[s.k-1]}" style="left:${s.x}%;top:${s.y}%;width:${s.w}%;height:${s.h}%"></button>`).join('')}</div>
    <div id="result"></div>
    <div class="ansbar"><div class="choices">${Array.from({length:N},(_,i)=>`<button data-k="${i+1}">${CIRC[i]}</button>`).join('')}</div>
    <div class="nav"><button class="btn sec" id="prev" ${prev?'':'disabled'}>‹ 前</button><div class="mid" id="mid"></div><button class="btn sec" id="next" ${next?'':'disabled'}>次 ›</button></div></div>`;
  const go=x=>{if(x)location.hash=qurl(x)};
  document.getElementById('prev').onclick=()=>go(prev);
  document.getElementById('next').onclick=()=>go(next);
  const mid=document.getElementById('mid');
  const btns=()=>$app.querySelectorAll('[data-k]');
  let done=false;
  const paintSel=k=>btns().forEach(b=>b.classList.toggle('sel',+b.dataset.k===k));
  const midBatch=()=>{const k=P[q.id];
    mid.innerHTML=(k?`<span class="pk" style="align-self:center"><b>${CIRC[k-1]}</b> を選択中</span>`:`<span class="muted" style="align-self:center">番号を選んでください</span>`)+
      `<button class="btn send" id="send2"></button>`+(k?`<button class="pill" id="clr" style="font-size:12px">選択を外す</button>`:'');
    document.getElementById('send2').onclick=()=>submitAll();
    const cl=document.getElementById('clr');if(cl)cl.onclick=()=>{delete P[q.id];save();paintSel(0);midBatch();refreshSend();};
    refreshSend();};
  const reveal=(k)=>{ // k=選んだ番号 / null=解説だけ
    done=true;const skb=document.getElementById('skip');if(skb)skb.remove();
    btns().forEach(b=>{b.classList.remove('sel');const bk=+b.dataset.k;if(bk==q.ans)b.classList.add('right');else if(bk==k)b.classList.add('pick');});
    const ok=k==q.ans;
    const v=k==null?`<div class="verdict nt">正解は ${CIRC[q.ans-1]}</div>`:ok?`<div class="verdict ok"><span class="ok">○ 正解！</span><small>${CIRC[q.ans-1]}</small></div>`:`<div class="verdict ng"><span class="ng">× 不正解</span><small>あなたの解答 ${CIRC[k-1]} ／ 正解は <b>${CIRC[q.ans-1]}</b></small></div>`;
    document.getElementById('result').innerHTML=v+`<div class="page"><img src="${q.a}.webp" alt="解説 ${q.id}"></div>`;
    mid.innerHTML=next?'<button class="btn" id="next2">次の問題へ ›</button>':`<a class="btn" href="#/ch/${c.ch}">一覧へ</a>`;
    const n2=document.getElementById('next2');if(n2)n2.onclick=()=>go(next);
    setTimeout(()=>document.getElementById('result').scrollIntoView({behavior:'smooth',block:'start'}),60);
  };
  const pickK=k=>{
    if(done)return;
    if(batch){P[q.id]=k;save();paintSel(k);midBatch();
      if(next&&ui.autoNext)setTimeout(()=>go(next),250);
      return;}
    record(q,k);save();reveal(k);
  };
  btns().forEach(b=>b.onclick=()=>pickK(+b.dataset.k));
  if(batch){paintSel(P[q.id]||0);midBatch();}
  else mid.innerHTML='<span class="muted" style="align-self:center">番号を押すとすぐ採点</span>';
  const sk=document.createElement('button');sk.className='pill';sk.id='skip';sk.textContent='解説だけ見る';sk.style.cssText='display:block;margin:8px auto 0;font-size:12px';
  sk.onclick=()=>{if(!done){delete P[q.id];save();reveal(null);refreshSend();}sk.remove();};
  $app.querySelector('.ansbar').appendChild(sk);
  document.onkeydown=e=>{if(dlg.open)return;const d=parseInt(e.key);if(d>=1&&d<=N)pickK(d);else if(e.key==='ArrowRight')go(next);else if(e.key==='ArrowLeft')go(prev);else if(e.key==='Enter'&&batch&&Object.keys(P).length)submitAll();};
  window.scrollTo(0,0);
}
function record(q,k){const r=S[q.id]||{n:0};r.n++;r.r=k==q.ans;r.k=k;r.at=Date.now();S[q.id]=r;}

// ---- 送信・採点
function submitAll(){
  const ids=Object.keys(P).filter(id=>QMAP[id]);
  if(!ids.length)return;
  ids.sort((a,b)=>{const[x1,y1]=a.split('-').map(Number),[x2,y2]=b.split('-').map(Number);return x1-x2||y1-y2;});
  LAST=ids.map(id=>{const q=QMAP[id],k=P[id];record(q,k);return{id,k,ok:k==q.ans};});
  P={};save();
  if(location.hash==='#/result')result();else location.hash='#/result';
}
function result(){
  setHead('採点結果',true);
  if(!LAST.length){$app.innerHTML='<div class="card empty">まだ送信した解答はありません</div>';return;}
  const ok=LAST.filter(x=>x.ok).length,wrong=LAST.filter(x=>!x.ok).map(x=>QMAP[x.id]).filter(Boolean);
  $app.innerHTML=`<div class="card" style="margin-bottom:12px"><div class="row" style="justify-content:space-between">
    <div><div class="muted" style="font-size:13px">採点結果</div><div class="score">${ok}<span style="font-size:22px"> / ${LAST.length}問</span></div><div class="muted">正答率 ${Math.round(ok/LAST.length*100)}%</div></div>
    <div class="row"><button class="btn" id="redo" ${wrong.length?'':'disabled'}>間違えた${wrong.length}問を解き直す</button><button class="btn sec" id="openAll">解説をすべて開く</button><a class="btn sec" href="#/">ホームへ</a></div></div>
    <div style="margin-top:10px">${bar({ok,ng:LAST.length-ok,total:LAST.length},10)}</div></div>
    <div class="res">${LAST.map(x=>{const q=QMAP[x.id];if(!q)return'';return `<details class="L${q.line}" ${x.ok?'':'open'}><summary><span class="mk ${x.ok?'ok':'ng'}">${x.ok?'○':'×'}</span><b>${q.id}</b><span class="tt">${esc(q.title||'')}</span>
      <span class="aa">あなた <b class="${x.ok?'ok':'ng'}">${CIRC[x.k-1]}</b> ／ 正解 <b>${CIRC[q.ans-1]}</b></span><a class="pill" href="${qurl(q)}" style="padding:4px 10px;font-size:12px" onclick="event.stopPropagation()">問題</a></summary>
      <div class="page"><img loading="lazy" src="${q.a}.webp" alt="解説 ${q.id}"></div></details>`}).join('')}</div>`;
  document.getElementById('redo').onclick=()=>startQueue(wrong);
  document.getElementById('openAll').onclick=()=>$app.querySelectorAll('details').forEach(d=>d.open=true);
  window.scrollTo(0,0);
}

// ---- ルーター
function route(){
  document.onkeydown=null;
  const h=location.hash.replace(/^#\/?/,'').split('/');
  if(h[0]==='result')return result();
  if(h[0]==='ch'){const c=BOOK.find(x=>x.ch==h[1]);if(!c)return home();
    if(h[2]==='q')return question(c,h[3]);
    queue=null;window.scrollTo(0,0);
    return chapter(c,h[2]==='sum'?'sum':'q');}
  queue=null;home();window.scrollTo(0,0);
}
addEventListener('hashchange',route);route();
</script>
</body>
