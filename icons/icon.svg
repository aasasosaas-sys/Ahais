      <path d="M300 300c40-38 110-52 150-30 30 17 20 52-6 70-22 15-18 44 6 62 26 20 18 58-14 70-40 15-62 52-88 80-24 26-62 6-70-30-9-40-40-70-30-115 7-40 18-78 52-107z"/>
